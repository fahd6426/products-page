name: Fetch Video
on:
  repository_dispatch:
    types: [fetch-video]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          pip install -U playwright "yt-dlp[default,curl-cffi]"
          python -m playwright install --with-deps chromium
      - name: Find video URL with browser
        run: |
          cat > grab.py << 'PYEOF'
          import sys, asyncio, re
          from urllib.parse import urlparse
          from playwright.async_api import async_playwright
          url = sys.argv[1]
          found = []
          final = {'url': url}
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch(headless=True, args=['--autoplay-policy=no-user-gesture-required', '--disable-blink-features=AutomationControlled'])
                  ctx = await b.new_context(user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36')
                  page = await ctx.new_page()
                  def on_resp(r):
                      u = r.url
                      ct = r.headers.get('content-type', '')
                      if '.m3u8' in u or '.mp4' in u or 'video/' in ct or 'mpegurl' in ct:
                          found.append(u)
                  page.on('response', on_resp)
                  await page.goto(url, wait_until='domcontentloaded', timeout=60000)
                  await page.wait_for_timeout(6000)
                  for f in page.frames:
                      try:
                          await f.click('video', timeout=2000)
                      except Exception:
                          pass
                      try:
                          src = await f.eval_on_selector('video', 'v => v.currentSrc || v.src')
                          if src and not src.startswith('blob:'):
                              found.append(src)
                      except Exception:
                          pass
                  await page.wait_for_timeout(8000)
                  try:
                      for f in page.frames:
                          h = await f.content()
                          for mm in re.findall(r'https?://[^\s"<>]+?\.(?:mp4|m3u8)', h):
                              found.append(mm)
                  except Exception:
                      pass
                  if 'streamff' in url:
                      vid = url.rstrip('/').split('/')[-1]
                      try:
                          r = await ctx.request.get('https://streamff.com/api/videos/' + vid)
                          txt = await r.text()
                          print('SFAPI', r.status, txt[:300])
                          for mm in re.findall(r'[^\s"<>]+\.mp4', txt):
                              mm = mm.replace(chr(92), '')
                              found.append(mm if mm.startswith('http') else 'https://streamff.com/' + mm.lstrip('/'))
                      except Exception as e:
                          print('SFERR', e)
                  final['url'] = page.url
                  print('TITLE', await page.title())
                  await b.close()
          asyncio.run(main())
          print('FINAL_URL', final['url'])
          print('FOUND', found[:20])
          found = [u for u in found if 'plyr.io' not in u and 'blank.mp4' not in u]
          m3u8 = [u for u in found if '.m3u8' in u]
          pick = (m3u8 or found or [''])[0]
          pu = urlparse(final['url'])
          open('video_url.txt', 'w').write(pick)
          open('referer.txt', 'w').write(pu.scheme + '://' + pu.netloc + '/')
          PYEOF
          python grab.py "${{ github.event.client_payload.video_url }}"
      - name: Download video
        run: |
          U=$(cat video_url.txt)
          R=$(cat referer.txt)
          echo "VIDEO: $U"
          test -n "$U"
          yt-dlp --impersonate chrome --add-header "Referer: $R" -f "best[ext=mp4]/best" -o "clip.%(ext)s" "$U"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: clip-${{ github.event.client_payload.run_id }}
          files: clip.*
